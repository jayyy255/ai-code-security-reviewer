rules:
  - id: exposed-aws-access-key
    languages: [javascript, typescript, python, java, go, ruby, php, rust, c, cpp, csharp]
    message: "Exposed AWS Access Key ID detected."
    severity: ERROR
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: secrets
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
    pattern-regex: '(?i)(AKIA|ASIA)[0-9A-Z]{16}'

  - id: exposed-github-token
    languages: [javascript, typescript, python, java, go, ruby, php, rust, c, cpp, csharp]
    message: "Exposed GitHub Personal Access Token or OAuth Token detected."
    severity: ERROR
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: secrets
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
    pattern-regex: 'gh[pousr]_[A-Za-z0-9_]{36,255}'

  - id: exposed-slack-token
    languages: [javascript, typescript, python, java, go, ruby, php, rust, c, cpp, csharp]
    message: "Exposed Slack bot or user token detected."
    severity: ERROR
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: secrets
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
    pattern-regex: 'xox[baprs]-[0-9a-zA-Z]{10,48}'

  - id: exposed-stripe-api-key
    languages: [javascript, typescript, python, java, go, ruby, php, rust, c, cpp, csharp]
    message: "Exposed Stripe secret API key detected."
    severity: ERROR
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: secrets
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
    pattern-regex: 'sk_(live|test)_[0-9a-zA-Z]{24,99}'

  - id: exposed-openai-api-key
    languages: [javascript, typescript, python, java, go, ruby, php, rust, c, cpp, csharp]
    message: "Exposed OpenAI API Key detected."
    severity: ERROR
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: secrets
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
    pattern-regex: 'sk-[a-zA-Z0-9]{32,64}'

  - id: exposed-google-api-key
    languages: [javascript, typescript, python, java, go, ruby, php, rust, c, cpp, csharp]
    message: "Exposed Google Cloud / Maps API Key detected."
    severity: ERROR
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: secrets
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
    pattern-regex: 'AIza[0-9A-Za-z\-_]{35}'

  - id: exposed-private-rsa-key
    languages: [javascript, typescript, python, java, go, ruby, php, rust, c, cpp, csharp]
    message: "Exposed RSA, EC, or OpenSSH Private Key header detected in source code."
    severity: ERROR
    metadata:
      cwe: ["CWE-312: Cleartext Storage of Sensitive Information"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      category: secrets
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
    pattern-regex: '-----BEGIN[ A-Z0-9_-]+PRIVATE KEY-----'

  - id: exposed-database-connection-string
    languages: [javascript, typescript, python, java, go, ruby, php, rust, c, cpp, csharp]
    message: "Hardcoded database connection string with plaintext credentials."
    severity: ERROR
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: secrets
      likelihood: HIGH
      impact: HIGH
      confidence: MEDIUM
    pattern-regex: '(postgres|mysql|mongodb|redis|amqp):\/\/[a-zA-Z0-9_\-\.]+:[a-zA-Z0-9_\-\.\@]+@[a-zA-Z0-9_\-\.]+'
