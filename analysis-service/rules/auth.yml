rules:
  - id: auth-hardcoded-jwt-secret
    languages: [javascript, typescript, python, go, java, ruby, php]
    message: "Hardcoded secret string used for signing or verifying JWT tokens."
    severity: ERROR
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: auth
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
    pattern-either:
      - pattern: jwt.sign($PAYLOAD, "...", ...)
      - pattern: jwt.verify($TOKEN, "...", ...)
      - pattern: jwt.encode($PAYLOAD, "...", ...)
      - pattern: jwt.decode($TOKEN, "...", ...)

  - id: auth-insecure-password-hashing
    languages: [javascript, typescript, python, go, java, php]
    message: "Use of plain MD5 or SHA1 for password hashing instead of bcrypt/Argon2/PBKDF2."
    severity: ERROR
    metadata:
      cwe: ["CWE-916: Use of Password Hash With Insufficient Computational Effort"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      category: auth
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
    pattern-either:
      - pattern: crypto.createHash("md5").update($PASS)
      - pattern: hashlib.md5($PASS.encode())
      - pattern: md5($PASS)
      - pattern: sha1($PASS)

  - id: auth-disabled-csrf-protection
    languages: [javascript, typescript, python]
    message: "CSRF protection is explicitly disabled or bypassed."
    severity: WARNING
    metadata:
      cwe: ["CWE-352: Cross-Site Request Forgery (CSRF)"]
      owasp: ["A01:2021 - Broken Access Control"]
      category: auth
      likelihood: HIGH
      impact: MEDIUM
      confidence: HIGH
    pattern-either:
      - pattern: "@csrf_exempt"
      - pattern: "csrf: false"

  - id: auth-hardcoded-bearer-token
    languages: [javascript, typescript, python, go, java]
    message: "Hardcoded Bearer authorization header found in code."
    severity: ERROR
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: auth
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
    pattern-regex: '(?i)Authorization:\s*Bearer\s+[a-zA-Z0-9_\-\.]{20,}'

  - id: auth-jwt-none-algorithm
    languages: [javascript, typescript, python]
    message: "JWT allowed algorithm includes 'none', allowing signature bypass."
    severity: ERROR
    metadata:
      cwe: ["CWE-347: Improper Verification of Cryptographic Signature"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      category: auth
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
    pattern-either:
      - pattern: 'algorithms=["none"]'
      - pattern: 'algorithm: "none"'
      - pattern: "algorithms: ['none']"
