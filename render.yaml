# Render Blueprint Specification (Infrastructure-as-Code)
# https://render.com/docs/blueprint-spec

services:
  # 1. FastAPI Analysis Engine (Semgrep + Gitleaks + ClamAV + Gemini)
  - type: web
    name: ai-security-analysis-engine
    env: docker
    dockerfilePath: ./analysis-service/Dockerfile
    dockerContext: ./analysis-service
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Set manually in Render Dashboard or .env

  # 2. Express API Gateway (Auth, Session Vault & Proxy)
  - type: web
    name: ai-security-express-api
    env: node
    rootDir: express-api
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: FASTAPI_URL
        value: https://ai-security-analysis-engine.onrender.com
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: true

  # 3. React Frontend Static Site
  - type: web
    name: ai-security-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Proxy all /api requests to Express Gateway
      - type: rewrite
        source: /api/*
        destination: https://ai-security-express-api.onrender.com/*
      # SPA Catch-all route for React Router DOM
      - type: rewrite
        source: /*
        destination: /index.html
